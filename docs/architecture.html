<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2328; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 14px; border-bottom: 1px solid #d0d7de; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: #f6f8fa; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header label { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  header input[type=search] { padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 6px; width: 200px; }
  header button { padding: 4px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; }
  .legend { display: flex; gap: 12px; font-size: 12px; align-items: center; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0003; vertical-align: middle; margin-right: 3px; }
  .legend .ln { display: inline-block; width: 26px; border-top: 2px solid #444; vertical-align: middle; margin-right: 3px; }
  main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1; min-width: 0; background: #fff; }
  #panel { width: 380px; border-left: 1px solid #d0d7de; overflow-y: auto; padding: 14px 16px; font-size: 13px; background: #fbfcfd; }
  #panel h2 { font-size: 16px; margin: 0 0 4px; word-break: break-all; }
  #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #57606a; margin: 16px 0 6px; }
  #panel ul { margin: 0; padding-left: 18px; }
  #panel li { margin: 3px 0; }
  #panel .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; color: #fff; margin-bottom: 8px; }
  #panel .open { display: inline-block; margin-top: 6px; padding: 4px 10px; border-radius: 6px; background: #0969da; color: #fff; text-decoration: none; }
  #panel .warn { background: #fff8c5; border: 1px solid #d4a72c66; padding: 6px 8px; border-radius: 6px; margin-top: 8px; }
  #panel a { color: #0969da; }
  #panel code { font-size: 12px; background: #eff1f3; padding: 0 3px; border-radius: 3px; }
  .muted { color: #57606a; }
</style>
</head>

<header>
  <h1>Carina Demo · module graph</h1>

  <label><input type="checkbox" data-kind="reads" checked> reads</label>
  <label><input type="checkbox" data-kind="launches" checked> launches</label>

  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="cy"></div>
  <aside id="panel"></aside>
</main>

/* ============================================================================
 * RENDERING
 * ==========================================================================*/
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const link = p => REPO_BASE + "/" + p;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function nodeHeight(n) {
  const descLines = Math.ceil(n.desc.length / 36);
  return 30 + 15 * descLines;
}

const elements = [
  ...Object.entries(GROUPS).map(([id, g]) => ({ data: { id: "group:" + id, label: g.label, isGroup: true, color: g.color } })),
  ...nodes.map(n => ({
    data: {
      id: n.id, parent: "group:" + n.group, group: n.group,
      label: n.label + "\n" + n.desc,
      color: GROUPS[n.group].color, fill: AREA_COLORS[n.area],
      h: nodeHeight(n), warn: !!n.warn,
    },
  })),
  ...edges.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, kind: e.kind, note: e.note } })),
];

if (typeof cytoscapeDagre !== "undefined" && cytoscape.use) {
  try { cytoscape.use(cytoscapeDagre); } catch (_) { /* already registered */ }
}

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements,
  layout: { name: "preset" },  // real layout (dagre) runs in runLayout()
  wheelSensitivity: 0.2,
  style: [
    { selector: "node", style: {
        shape: "round-rectangle", width: 250, height: "data(h)",
        "background-color": "data(fill)", "border-color": "data(color)", "border-width": 2,
        label: "data(label)", "text-wrap": "wrap", "text-max-width": 234,
        "text-valign": "center", "text-halign": "center", "font-size": 11, color: "#1f2328",
        "line-height": 1.3 } },
    { selector: "node[?warn]", style: { "border-style": "dashed" } },
    { selector: "node[?isGroup]", style: {
        shape: "round-rectangle", "background-color": "data(color)", "background-opacity": 0.04,
        "border-color": "data(color)", "border-width": 1, "border-style": "solid",
        label: "data(label)", "text-valign": "top", "text-halign": "center", "font-size": 16,
        "font-weight": "bold", color: "data(color)", padding: 18 } },
    { selector: "edge", style: {
        width: 1.6, "curve-style": "bezier", "target-arrow-shape": "triangle",
        "line-color": "#57606a", "target-arrow-color": "#57606a", "arrow-scale": 1 } },
    { selector: "edge[kind = 'runtime']", style: { "line-style": "dashed", "line-color": "#0969da", "target-arrow-color": "#0969da" } },
    { selector: "edge[kind = 'reads']", style: { "line-style": "dotted", "line-color": "#8c959f", "target-arrow-color": "#8c959f", width: 1.4 } },
    { selector: "edge[kind = 'launches']", style: { "line-color": "#8250df", "target-arrow-color": "#8250df", width: 1 } },
    { selector: ".faded", style: { opacity: 0.12 } },
    { selector: "node.focus", style: { "border-width": 4 } },
    { selector: "edge.hl", style: { width: 3 } },
    { selector: "node.match", style: { "border-width": 4, "border-color": "#bf8700" } },
  ],
});

function runLayout() {
  cy.layout({ name: "dagre", rankDir: "LR", nodeSep: 18, rankSep: 90, edgeSep: 8, fit: true, padding: 30,
              filter: () => true }).run();
}
runLayout();

// ---------------------------------------------------------------- side panel
const panel = document.getElementById("panel");

function showIntro() {
  panel.innerHTML = `
    <h2>Carina Demo – module graph</h2>
    <p class="muted">Each box is a module; an arrow <b>A → B</b> means A calls / uses B.</p>
    <ul>
      <li><b>Main code</b>: one box per leaf Java package in <code>src/main/java</code>.</li>
      <li><b>Test code</b>: top-level test classes grouped by feature; regression sub-packages as-is.</li>
      <li><b>Resources</b>: groups of config / template / data files.</li>
      <li><b>Build</b>: Maven and the TestNG suites that launch tests.</li>
    </ul>
    <h3>Edge kinds</h3>
    <ul>
      <li><b>calls</b> (solid): compile-time import / extends / instantiates.</li>
      <li><b>runtime</b> (dashed blue): Carina <code>@DeviceType</code> picks the platform class behind <code>initPage(…Base.class)</code>.</li>
      <li><b>reads</b> (dotted): loads a config / template / data file.</li>
      <li><b>launches</b> (purple): build → suite → test.</li>
    </ul>
    <p class="muted">Click a box for details and a link to the code; double-click opens the code directly. Dashed borders mark modules with a caveat.</p>`;
}

function edgeList(list, dir) {
  if (!list.length) return `<p class="muted">none</p>`;
  return "<ul>" + list.map(e => {
    const other = nodeById[dir === "out" ? e.target : e.source];
    return `<li><a href="#" data-goto="${esc(other.id)}">${esc(other.label)}</a> <span class="muted">[${e.kind}]</span><br><span class="muted">${esc(e.note || "")}</span></li>`;
  }).join("") + "</ul>";
}

function showNode(id) {
  const n = nodeById[id];
  if (!n) return;
  const out = edges.filter(e => e.source === id);
  const inc = edges.filter(e => e.target === id);
  const g = GROUPS[n.group];
  panel.innerHTML = `
    <span class="tag" style="background:${g.color}">${esc(g.label)}</span>
    <h2>${esc(n.label)}</h2>
    <p>${esc(n.desc)}</p>
    <a class="open" href="${esc(link(n.path))}" target="_blank" rel="noopener">Open code ↗</a>
    <div class="muted" style="margin-top:4px"><code>${esc(n.path)}</code></div>
    ${n.warn ? `<div class="warn">⚠ ${esc(n.warn)}</div>` : ""}
    ${n.note ? `<div class="warn">ℹ ${esc(n.note)}</div>` : ""}
    <h3>Files (${n.files.length})</h3>
    <ul>${n.files.map(([f, d]) => `<li><a href="${esc(link(n.dir + f))}" target="_blank" rel="noopener">${esc(f)}</a>${d ? ` <span class="muted">– ${esc(d)}</span>` : ""}</li>`).join("")}</ul>
    <h3>Uses → (${out.length})</h3>${edgeList(out, "out")}
    <h3>Used by ← (${inc.length})</h3>${edgeList(inc, "in")}`;
  panel.querySelectorAll("[data-goto]").forEach(a => a.addEventListener("click", ev => {
    ev.preventDefault(); focusNode(a.dataset.goto, true);
  }));
}

function clearFocus() {
  cy.elements().removeClass("faded focus hl match");
}

function focusNode(id, center) {
  clearFocus();
  const node = cy.getElementById(id);
  const hood = node.closedNeighborhood().union(node.ancestors()).union(node.closedNeighborhood().nodes().ancestors());
  cy.elements().not(hood).addClass("faded");
  node.addClass("focus");
  node.connectedEdges().addClass("hl");
  if (center) cy.animate({ center: { eles: node }, duration: 250 });
  showNode(id);
}

cy.on("tap", "node", ev => {
  if (ev.target.data("isGroup")) return;
  focusNode(ev.target.id(), false);
});
cy.on("dbltap", "node", ev => {
  const n = nodeById[ev.target.id()];
  if (n) window.open(link(n.path), "_blank", "noopener");
});
cy.on("tap", ev => { if (ev.target === cy) { clearFocus(); showIntro(); } });

// ---------------------------------------------------------------- controls
document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
document.getElementById("reset").onclick = () => {
  clearFocus(); showIntro(); document.getElementById("search").value = "";
  document.querySelectorAll("header input[type=checkbox]").forEach(c => { c.checked = true; });
  cy.elements().style("display", "element"); runLayout();
};

document.querySelectorAll("header input[data-kind]").forEach(cb => cb.addEventListener("change", () => {
  cy.edges(`[kind = '${cb.dataset.kind}']`).style("display", cb.checked ? "element" : "none");
}));
document.getElementById("showResources").addEventListener("change", ev => {
  const show = ev.target.checked;
  cy.nodes("[group = 'resources'], #group\\:resources").style("display", show ? "element" : "none");
  runLayout();
});

document.getElementById("search").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  cy.elements().removeClass("match faded");
  if (!q) return;
  const hits = nodes.filter(n => (n.label + " " + n.desc + " " + n.files.map(f => f[0]).join(" ")).toLowerCase().includes(q));
  const ids = new Set(hits.map(n => n.id));
  cy.nodes().forEach(el => {
    if (el.data("isGroup")) return;
    el.addClass(ids.has(el.id()) ? "match" : "faded");
  });
  cy.edges().addClass("faded");
  if (hits.length === 1) focusNode(hits[0].id, true);
});

document.getElementById("legend").innerHTML =
  Object.values(GROUPS).map(g => `<span><span class="sw" style="background:${g.color}"></span>${g.label}</span>`).join("") +
  `<span><span class="ln"></span>calls</span>` +
  `<span><span class="ln" style="border-top:2px dashed #0969da"></span>runtime</span>` +
  `<span><span class="ln" style="border-top:2px dotted #8c959f"></span>reads</span>` +
  `<span><span class="ln" style="border-color:#8250df"></span>launches</span>`;

showIntro();
</script>
